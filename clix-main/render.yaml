services:
  # ─────────────────────────────────────────────────────────────────────────────
  # CLIX HUB – CCMS Backend (Node.js + Express + MongoDB)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: clix-hub-ccms-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # IMPORTANT: Enter your MongoDB Atlas URI in the Render Dashboard

  # ─────────────────────────────────────────────────────────────────────────────
  # CLIX HUB – CCMS Frontend  (Vite + React + TypeScript)
  # Render builds the project and serves the dist/ folder as a Static Site.
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: clix-hub-ccms
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # SPA fallback – all routes → index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false # IMPORTANT: Set this to your backend URL + /api (e.g., https://clix-hub-ccms-backend.onrender.com/api)
      # ── Firebase ───────────────────────────────────────────────────────────
