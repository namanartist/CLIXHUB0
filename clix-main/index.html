<head>

  <meta property="og:type" content="website" />

  <meta property="og:title" content="Clix Hub - Campus Operating System & Club Experience Platform" />

  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="icon" type="image/png" href="/image.png" />
  <link rel="apple-touch-icon" href="/image.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Structured Data JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://clixmits.vercel.app/#website",
        "url": "https://clixmits.vercel.app/",
        "name": "Clix Hub",
        "description": "The unified campus operating system for student clubs, hackathons, and certifications.",
        "publisher": {
          "@type": "EducationalOrganization",
          "name": "Madhav Institute of Technology & Science (MITS) Gwalior",
          "url": "https://web.mitsgwalior.in/"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://clixmits.vercel.app/clubs?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "SoftwareApplication",
        "@id": "https://clixmits.vercel.app/#software",
        "name": "Clix Hub",
        "operatingSystem": "All",
        "applicationCategory": "EducationalApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        }
      }
    ]
  }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#0099FF',
            'primary-hover': '#007ACC',
            navy: {
              50: '#F0F4FD',
              100: '#E0E7FF',
              700: '#1B2559',
              800: '#111C44',
              900: '#02040a',
            }
          }
        }
      }
    }
  </script>

    rel="stylesheet">
</head>
